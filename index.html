.meta{display:flex;justify-content:center;gap:22px;font-size:13px;color:var(--muted)}

/* question */
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:2px;background:var(--line);border-radius:2px;margin:12px 0 30px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .35s ease}
.q h2{font-size:clamp(26px,6.5vw,34px);margin-bottom:24px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:15.5px;line-height:1.45;padding:16px 18px;border-radius:16px;cursor:pointer;transition:border-color .2s, background .2s, transform .15s}

.opt.picked{background:var(--tint);border-color:var(--gold)}
.back{align-self:flex-start;margin-top:14px}

/* result */
.res{display:flex;flex-direction:column;gap:20px}
.res .name{font-size:clamp(40px,11vw,58px);color:var(--gold-soft);font-style:italic;font-weight:400}
.res .voice{font-family:var(--serif);font-size:22px;line-height:1.3;color:var(--ink);border-left:1px solid var(--gold);padding-left:16px;margin:0}
.res p{margin:0;color:var(--muted)}
.res p b{color:var(--ink);font-weight:500}
.loop{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}
.loop p{color:var(--ink)}
.loop .btn{margin-top:18px}
.sign{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:20px}
@media (prefers-reduced-motion:reduce){.bar i,.opt,.btn{transition:none}}

.ladder{display:grid;gap:6px;margin:4px 0}
.step{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-size:14px;color:var(--muted)}
.step b{font-family:var(--serif);font-size:20px;font-weight:500;width:18px;color:var(--muted)}
.step em{margin-left:auto;font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.step.me{background:var(--tint);border-color:var(--gold);color:var(--ink)}
.step.me b,.step.me em{color:var(--gold-soft)}
.step.next{border-style:dashed;border-color:var(--gold);color:var(--ink)}
.step.next em{color:var(--gold)}
.task{border-top:1px solid var(--line);padding-top:18px}
.task h3{font-family:var(--serif);font-weight:500;font-size:24px;margin:0 0 8px}

/* типографика под Unbounded */
h1,h2,h3{letter-spacing:-.02em;font-weight:500}
em{font-style:normal}
.hl,h1 em{color:inherit!important;font-weight:inherit!important;background:linear-gradient(transparent 58%, var(--accent) 58%, var(--accent) 92%, transparent 92%);padding:0 .08em}

  'При этом уровень жизни держится на вашей ежедневной работе и огромном количестве сил и энергии. Здесь вы только начинаете осваивать финансовую грамотность, и то, как вы мыслите о деньгах, решает, пойдете ли вы дальше или останетесь на этой ступени.']},
 4:{name:'Финансовая независимость',voice:'Пассивный доход уже покрывает ваши расходы.',
  text:['Ваши деньги приходят не только от работы, есть пассивные источники от личного капитала, и их хватает на текущую жизнь сейчас и дальше. Можно расслабиться и позволять себе самое лучшее.',
  'Дальше путь почти целиком про мышление. На пути к свободе примерно 80% затрат умственные, и именно стратегии мышления решают, где вы остановитесь.']},
 5:{name:'Финансовая свобода',voice:'Пассивный доход больше, чем вы можете потратить.',
  text:['Это высший финансовый уровень. Денег столько, что вы тратите и не можете потратить, живете там, где хотите, и путешествуете, когда хотите.',
  'Вы наверняка знаете, сколько мышления вложено в эту точку. Удержать ее тоже задача мышления, и мне будет очень ценно ваше мнение о том, что я рассказываю про деньги у себя в канале.']}
};
var app=document.getElementById('app');
var answers=[];var i=0;var busy=false;
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}return a;}
var KEYS=['1','2','3','4','5'];
var orders=Q.map(function(){return shuffle(KEYS);});
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

function intro(){
 app.innerHTML='<div class="intro">'+
 '<div class="coin" aria-hidden="true"><span>₽</span></div>'+
 '<div class="eyebrow">Тест Ирины Гребенюковой</div>'+
 '<h1>На каком уровне <em>финансовой безопасности</em> вы сейчас?</h1>'+
 '<p>Всего существует 5 уровней. Отвечайте честно, без иллюзий и без «у меня все классно». Результат увидите только вы.</p>'+
 '<div class="meta"><span><b>15</b> вопросов</span><span><b>4</b> минуты</span></div>'+
 '<button class="btn" id="go">Узнать свой уровень</button></div>';
 document.getElementById('go').onclick=function(){i=0;answers=[];question();};
}

function question(){
 var q=Q[i];var pct=Math.round(i/Q.length*100);
 var h='<div class="top"><span>Вопрос '+(i+1)+' из '+Q.length+'</span><span class="eyebrow">точка А</span></div>'+
 '<div class="bar"><i style="width:'+pct+'%"></i></div><div class="q"><h2>'+esc(q.q)+'</h2><div class="opts">';
 orders[i].forEach(function(k){h+='<button class="opt'+(answers[i]===k?' picked':'')+'" data-k="'+k+'">'+esc(q.o[k])+'</button>';});
 h+='</div></div>';
 if(i>0)h+='<button class="link back" id="back">Назад</button>';
 app.innerHTML=h;busy=false;
 app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
  if(busy)return;busy=true;b.classList.add('picked');answers[i]=b.getAttribute('data-k');
  if(tg){try{tg.HapticFeedback.selectionChanged();}catch(e){}}
  setTimeout(function(){i++;if(i<Q.length)question();else result();},220);
 };});
 var bk=document.getElementById('back');if(bk)bk.onclick=function(){i--;question();};
 window.scrollTo(0,0);
}

function level(){
 // долги снежным комом = яма, как в описании уровня
 if(answers[3]==='1')return 1;
 var sum=0;answers.forEach(function(k){sum+=+k;});
 var avg=sum/answers.length;
 return Math.max(1,Math.min(5,Math.floor(avg+0.4))); // при сомнении честнее округлять вниз
}

function result(){
 var lv=level();var r=L[lv];
 var names=['Финансовая яма','Финансовая безопасность','Финансовая стабильность','Финансовая независимость','Финансовая свобода'];
 var lad='<div class="ladder">';
 for(var n=5;n>=1;n--){var cls=n===lv?' me':(n===lv+1?' next':'');var tag=n===lv?'<em>вы здесь</em>':(n===lv+1?'<em>точка Б</em>':'');
  lad+='<div class="step'+cls+'"><b>'+n+'</b>'+names[n-1]+tag+'</div>';}
 lad+='</div>';
 var taskTxt=lv<5?'Запишите на бумаге точку А и точку Б в цифрах: сколько вы зарабатываете сейчас и сколько хотите, уже за вычетом расходов. Реальная точка Б для мозга это рост примерно в три раза. Если сейчас вы зарабатываете 30 тысяч и ставите цель миллион, мозг просто отбросит ее как иллюзию и даже не начнет двигаться в эту сторону.':'Запишите, что для вас значит следующая ступень в жизни, если финансовая уже пройдена. Деньги здесь становятся инструментом, и интересно посмотреть, куда вы его направляете.';
 app.innerHTML='<div class="res">'+
 '<div class="eyebrow">Ваш уровень сейчас</div>'+
 '<h1 class="name">'+r.name+'</h1>'+
 '<p class="voice">'+esc(r.voice)+'</p>'+ lad +
 r.text.map(function(t){return '<p>'+esc(t)+'</p>';}).join('')+
 '<div class="task"><h3>Задание от меня</h3><p>'+esc(taskTxt)+'</p></div>'+
 '<div class="loop"><p>Почему люди годами стоят на одном уровне, даже когда много работают и прорабатываются? Потому что уровень держится на стратегии мышления, и пока ее не увидишь, цифры не меняются. Об этом я рассказываю у себя в канале.</p>'+
 '<p style="margin-top:12px;color:var(--muted)">А в октябре я провожу семидневный денежный марафон, где мы вместе пройдем путь от вашей точки А к точке Б. Анонс будет в канале.</p>'+
 '<a class="btn" id="ch" href="'+CHANNEL+'" target="_blank" rel="noopener">Перейти в канал</a></div>'+
 '<div class="sign">Ирина Гребенюкова</div>'+
 '<button class="link" id="again">Пройти еще раз</button></div>';
 document.getElementById('ch').onclick=function(e){if(tg){e.preventDefault();try{tg.openTelegramLink(CHANNEL);}catch(x){location.href=CHANNEL;}}};
 document.getElementById('again').onclick=function(){orders=Q.map(function(){return shuffle(KEYS);});intro();};
 window.scrollTo(0,0);
}
intro();
})();
(function(){var c=document.getElementById('sparks');if(!c)return;var x=c.getContext('2d');var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;var W,H,S=[];
function sz(){var d=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);S=[];for(var i=0;i<45;i++)S.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.5,p:Math.random()*6.28,s:.01+Math.random()*.025,c:['#f3d596','#e4c07c','#fff4d6'][i%3]});}
sz();addEventListener('resize',sz);var t=0;
function f(){t++;x.clearRect(0,0,W,H);S.forEach(function(s){x.globalAlpha=.25+.6*Math.abs(Math.sin(s.p+t*s.s));x.fillStyle=s.c;x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill();if(s.r>1.8){x.strokeStyle=s.c;x.lineWidth=.8;x.beginPath();x.moveTo(s.x-6,s.y);x.lineTo(s.x+6,s.y);x.moveTo(s.x,s.y-6);x.lineTo(s.x,s.y+6);x.stroke();}});x.globalAlpha=1;if(!reduce)requestAnimationFrame(f);}f();})();

</script>
