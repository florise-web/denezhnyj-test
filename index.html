<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Уровень финансовой безопасности</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=Cormorant+Garamond:ital,wght@1,500&family=Great+Vibes&family=Manrope:wght@300;400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#fbf8f2;--bg2:#f4efe6;--panel:#ffffff;--line:rgba(18,63,49,.13);
  --gold:#1f7a5c;--gold-soft:#123f31;--ink:#123f31;--muted:#557065;
  --accent:#f6bec8;--ruby:#c2263f;--on-btn:#ffffff;--btn-hover:#9c1a30;
  --tint:rgba(170,230,205,.35);--glow:rgba(246,190,200,.55);
  --serif:"Cormorant SC","Cormorant Garamond",Georgia,serif;
  --italic:"Cormorant Garamond",Georgia,serif;
  --sans:"Manrope","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(80% 50% at 50% 0%, var(--glow), transparent 70%),var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-inline:20px;padding-block:28px 40px;display:flex;flex-direction:column}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:500}
h1,h2{font-family:var(--serif);font-weight:500;line-height:1.08;text-wrap:balance;margin:0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;background:var(--gold);color:var(--on-btn);font-family:var(--sans);font-weight:600;font-size:16px;padding:17px 24px;border-radius:999px;border:0;cursor:pointer;text-decoration:none;transition:background .2s}
.btn:hover{background:var(--btn-hover)}
.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:10px;margin-top:6px}

/* intro */
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;text-align:center}
.coin{width:132px;height:132px;margin:0 auto 6px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;position:relative}
.coin::before,.coin::after{content:"";position:absolute;inset:12px;border-radius:50%;border:1px solid rgba(31,107,79,.25)}
.coin::after{inset:26px;border-color:var(--accent)}
.coin span{font-family:var(--serif);font-size:44px;color:var(--gold-soft);font-style:italic}
.intro h1{font-size:clamp(36px,9vw,50px)}
.intro h1 em{color:var(--gold);font-weight:400}
.intro p{color:var(--muted);margin:0 auto;max-width:34ch}
.meta{display:flex;justify-content:center;gap:22px;font-size:13px;color:var(--muted)}
.meta b{color:var(--gold-soft);font-weight:500}

/* question */
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:2px;background:var(--line);border-radius:2px;margin:12px 0 30px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .35s ease}
.q h2{font-size:clamp(26px,6.5vw,34px);margin-bottom:24px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:15.5px;line-height:1.45;padding:16px 18px;border-radius:16px;cursor:pointer;transition:border-color .2s, background .2s, transform .15s}
.opt:hover{border-color:var(--gold)}
.opt.picked{background:var(--tint);border-color:var(--gold)}
.back{align-self:flex-start;margin-top:14px}

/* result */
.res{display:flex;flex-direction:column;gap:20px}
.res .name{font-size:clamp(40px,11vw,58px);color:var(--gold-soft);font-style:italic;font-weight:400}
.res .voice{font-family:var(--serif);font-size:22px;line-height:1.3;color:var(--ink);border-left:1px solid var(--gold);padding-left:16px;margin:0}
.res p{margin:0;color:var(--muted)}
.res p b{color:var(--ink);font-weight:500}
.loop{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}
.loop p{color:var(--ink)}
.loop .btn{margin-top:18px}
.sign{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:20px}
@media (prefers-reduced-motion:reduce){.bar i,.opt,.btn{transition:none}}

.ladder{display:grid;gap:6px;margin:4px 0}
.step{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-size:14px;color:var(--muted)}
.step b{font-family:var(--serif);font-size:20px;font-weight:500;width:18px;color:var(--muted)}
.step em{margin-left:auto;font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.step.me{background:var(--tint);border-color:var(--gold);color:var(--ink)}
.step.me b,.step.me em{color:var(--gold-soft)}
.step.next{border-style:dashed;border-color:var(--gold);color:var(--ink)}
.step.next em{color:var(--gold)}
.task{border-top:1px solid var(--line);padding-top:18px}
.task h3{font-family:var(--serif);font-weight:500;font-size:24px;margin:0 0 8px}

/* типографика под Unbounded */
h1,h2,h3{letter-spacing:-.02em;font-weight:500}
em{font-style:normal}
.hl,h1 em{color:inherit!important;font-weight:inherit!important;background:linear-gradient(transparent 58%, var(--accent) 58%, var(--accent) 92%, transparent 92%);padding:0 .08em}

.intro h1{font-size:clamp(26px,7vw,36px);line-height:1.15}
.q h2{font-size:clamp(20px,5.2vw,25px);line-height:1.25}
.res .name{font-size:clamp(28px,8vw,40px);font-style:normal;color:var(--ink);font-weight:600}
.res .voice{font-family:var(--sans);font-size:18px;font-weight:500;border-left:3px solid var(--accent)}
.coin{background:var(--panel)}
.coin span{font-family:var(--serif);font-style:normal;font-size:40px;color:var(--gold)}
.step b{font-size:17px}
.step.me{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.step.me b,.step.me em{color:var(--ink)}
.sign{font-family:var(--sans);font-style:normal;font-size:15px;font-weight:600;color:var(--gold)}
.task h3{font-size:19px}
.opt{box-shadow:0 1px 0 rgba(20,52,43,.04)}

/* Жемчужный сад */
body{background:radial-gradient(70% 45% at 95% 0%, rgba(246,190,200,.75), transparent 70%),radial-gradient(70% 45% at 0% 100%, rgba(170,230,205,.8), transparent 70%),var(--bg);background-attachment:fixed}
#sparks{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.app{position:relative;z-index:1}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:.005em}
.eyebrow{color:var(--ruby);font-weight:700}
.btn{background:var(--ruby);box-shadow:0 10px 26px rgba(194,38,63,.32),0 0 0 6px rgba(246,190,200,.35)}
.btn:hover{background:var(--btn-hover)}
#ch{background:var(--gold);box-shadow:0 10px 26px rgba(31,122,92,.3),0 0 0 6px rgba(170,230,205,.45)}
#ch:hover{background:#18604a}
.hl,h1 em{background:none;color:var(--ruby)!important;font-family:var(--italic);font-style:italic;font-weight:500!important;text-transform:none;padding:0}
.intro h1{font-size:clamp(32px,8.5vw,44px);line-height:1.05}
.q h2{font-size:clamp(24px,6vw,30px);line-height:1.12}
.res .name{font-size:clamp(34px,9vw,46px);font-weight:700;line-height:1.02}
.res .voice{font-family:var(--italic);font-style:italic;font-size:21px;font-weight:500;color:var(--ruby);border-left:2px solid var(--accent)}
.coin{background:radial-gradient(circle at 38% 35%,#fff,#fdf1f3 45%,#f6d6dc 70%,#eab9c3);border:0;box-shadow:0 0 40px 10px rgba(255,255,255,.9),0 0 80px 24px rgba(246,190,200,.55)}
.coin::before,.coin::after{display:none}
.coin span{color:var(--ruby);font-family:var(--italic);font-style:italic}
.opt{background:rgba(255,255,255,.85)}
.opt:hover{border-color:var(--ruby)}
.opt.picked{background:var(--accent);border-color:var(--ruby)}
.bar i{background:var(--ruby)}
.step{background:rgba(255,255,255,.75)}
.step b{font-family:var(--serif)}
.step.me{background:var(--ruby);border-color:var(--ruby);color:#fff;box-shadow:0 0 22px rgba(194,38,63,.4)}
.step.me b,.step.me em{color:#fff}
.step.next{background:rgba(227,245,236,.85);border-color:var(--gold)}
.loop{background:rgba(255,255,255,.85)}
.sign{color:var(--ruby);font-family:var(--italic);font-style:italic;font-size:20px;font-weight:500}
.task h3{font-size:24px}

/* Черный жемчуг: графит, шампанское золото, рубин */
:root{color-scheme:dark;--bg:#141210;--panel:#211d19;--line:rgba(228,192,124,.2);--gold:#e4c07c;--gold-soft:#f0d49a;--ink:#f4ede1;--muted:#b5a992;--accent:#e4c07c;--ruby:#c8182f;--btn-hover:#9b0f22;--tint:rgba(228,192,124,.12);--script:"Great Vibes",cursive}
body{background:radial-gradient(60% 40% at 50% 0%,rgba(212,168,92,.2),transparent 70%),radial-gradient(60% 40% at 0% 100%,rgba(212,168,92,.08),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink)}
.eyebrow{color:var(--gold);font-weight:600;letter-spacing:.26em}
h1,h2,h3{color:var(--ink)}
.goldtxt,.intro h1 em,.hl{background:linear-gradient(180deg,#fbeac0,#e8c47f 45%,#c1914a 75%,#f0d49a)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important;font-family:var(--script)!important;font-style:normal!important;font-weight:400!important;text-transform:none;font-size:1.28em;line-height:1;padding:0 .05em}
.intro h1{font-size:clamp(32px,8.5vw,44px);line-height:1.1}
.coin{background:radial-gradient(circle at 35% 30%,#fff3cf,#e6bd6c 42%,#b0802f 78%,#7a531a);box-shadow:0 0 50px 8px rgba(228,192,124,.35),inset 0 0 0 5px rgba(122,83,26,.35),inset 0 0 0 9px rgba(255,236,190,.35)}
.coin span{color:#5e3f10;font-family:var(--serif);font-style:normal;font-weight:700;font-size:50px;text-shadow:0 1px 0 rgba(255,240,200,.6)}
.intro p,.meta{color:var(--muted)}
.meta b{color:var(--gold)}
.btn{background:linear-gradient(180deg,#e0263d,var(--ruby) 55%,var(--btn-hover));border:1px solid rgba(255,140,150,.35);border-radius:18px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;font-size:15px;box-shadow:0 14px 36px rgba(200,24,47,.38),inset 0 1px 0 rgba(255,255,255,.25)}
.btn:hover{filter:brightness(1.08);background:linear-gradient(180deg,#e0263d,var(--ruby) 55%,var(--btn-hover))}
#ch{background:linear-gradient(180deg,#e0263d,var(--ruby) 55%,var(--btn-hover));color:#fff;border:1px solid rgba(255,140,150,.35);box-shadow:0 14px 36px rgba(200,24,47,.38),inset 0 1px 0 rgba(255,255,255,.25)}
#ch:hover{filter:brightness(1.08);background:linear-gradient(180deg,#e0263d,var(--ruby) 55%,var(--btn-hover))}
.top{color:var(--muted)}
.bar{background:rgba(228,192,124,.15)}
.bar i{background:linear-gradient(90deg,#c1914a,#f0d49a)}
.opt{background:var(--panel);border-color:var(--line);color:var(--ink);box-shadow:none}
.opt:hover{border-color:var(--gold);background:#27221d}
.opt.picked{background:rgba(228,192,124,.16);border-color:var(--gold);color:var(--ink)}
.link{color:var(--muted)}
.res .name{color:transparent;background:linear-gradient(180deg,#fbeac0,#e8c47f 45%,#c1914a 75%,#f0d49a);-webkit-background-clip:text;background-clip:text}
.res .voice{color:var(--gold-soft);border-left:2px solid var(--gold)}
.res p{color:var(--muted)}
.res p b{color:var(--ink)}
.step{background:var(--panel);border-color:var(--line);color:var(--muted)}
.step b{color:var(--muted)}
.step.me{background:linear-gradient(180deg,#e0263d,#9b0f22);border-color:#e0263d;color:#fff;box-shadow:0 0 26px rgba(200,24,47,.45)}
.step.me b,.step.me em{color:#fff}
.step.next{background:rgba(228,192,124,.08);border-color:var(--gold);color:var(--ink)}
.step.next em{color:var(--gold)}
.loop{background:var(--panel);border-color:rgba(228,192,124,.32)}
.loop p{color:var(--ink)}
.task{border-top-color:var(--line)}
.task h3{color:var(--gold)}
.sign{color:var(--gold);font-family:var(--script);font-style:normal;font-size:30px}

html{background:#1c040b}
:root{--bg:#240610;--panel:rgba(255,236,224,.05);--line:rgba(236,211,168,.22);--gold:#ecd3a8;--gold-soft:#f4e3c4;--ink:#f8f0e7;--muted:#d3b9b0;--ruby:#8a2338;--btn-hover:#6d1a2c}
body{background:radial-gradient(60% 40% at 100% 0%,rgba(138,35,56,.55),transparent 70%),radial-gradient(50% 40% at 0% 100%,rgba(109,26,44,.5),transparent 70%),linear-gradient(180deg,#2a0712,#1c040b);background-attachment:fixed}
.btn,#ch{background:linear-gradient(180deg,#fff6e8,#ecd3a8 55%,#d2ad76)!important;color:#3b0a16!important;border:0!important;border-radius:999px!important;box-shadow:0 12px 30px rgba(0,0,0,.35),0 0 0 6px rgba(236,211,168,.14),inset 0 1px 0 rgba(255,255,255,.8)!important}
.btn:hover,#ch:hover{filter:brightness(1.05)}

.coin{background:radial-gradient(circle at 35% 30%,#ffffff 0%,#f6ece2 35%,#d9c7b8 75%,#b9a597 100%);box-shadow:0 0 50px 10px rgba(255,240,225,.28),inset 0 0 0 5px rgba(185,165,151,.35)}
.coin span{color:#6d1a2c;text-shadow:none}

.hero-ph{width:min(62vw,230px);aspect-ratio:4/5;margin:0 auto 4px;border-radius:999px 999px 26px 26px;overflow:hidden;border:1.5px solid rgba(236,211,168,.55);box-shadow:0 0 0 8px rgba(236,211,168,.08),0 24px 60px rgba(0,0,0,.5),0 0 60px rgba(138,35,56,.5)}
.hero-ph img{width:100%;height:100%;object-fit:cover;display:block}
.intro{gap:18px}

.loop .hook{font-family:var(--italic);font-style:italic;font-size:23px;line-height:1.3;color:var(--gold-soft)}
.loop .cmp{margin-top:12px;background:rgba(236,211,168,.1);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px}
.loop .again-note{margin-top:12px;color:var(--muted);font-size:15px}
.loop .btn{text-align:center;letter-spacing:.06em}
.loop .under{margin-top:12px;font-size:14.5px;color:var(--ink);text-align:center}
</style>

 return Math.max(1,Math.min(5,Math.floor(avg+0.4))); // при сомнении честнее округлять вниз
}
